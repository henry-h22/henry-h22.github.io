  </p>
  <p>
  All my research code is on my GitHub so that <del>AI companies can scrape it</del> it can be adapted for similar work! I feel like phonetics research is just the same three steps most of the time anyway lol
  </p>
  <p>
  Feel free to reach out if I can help you in literally any way I love to say yes to things
